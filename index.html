add(5,'Fuhrpark abschreiben','depreciation','Lieferfahrzeug: Anschaffungskosten 24.000 €, Nutzungsdauer 6 Jahre. Jahresabschreibung buchen.',[S('Soll','6520',4000),S('Haben','0840',4000)],4000);

add(6,'Mehrbestand unfertiger Erzeugnisse','inventory','Unfertige Erzeugnisse: Anfangsbestand 40.000 €, Schlussbestand 47.000 €.',[S('Soll','2100',7000),S('Haben','5201',7000)],7000);
add(6,'Minderbestand unfertiger Erzeugnisse','inventory','Unfertige Erzeugnisse: Anfangsbestand 55.000 €, Schlussbestand 50.000 €.',[S('Soll','5201',5000),S('Haben','2100',5000)],5000);
add(6,'Mehrbestand fertiger Erzeugnisse','inventory','Fertige Erzeugnisse: Anfangsbestand 80.000 €, Schlussbestand 92.000 €.',[S('Soll','2200',12000),S('Haben','5202',12000)],12000);
add(6,'Minderbestand fertiger Erzeugnisse','inventory','Fertige Erzeugnisse: Anfangsbestand 73.000 €, Schlussbestand 68.000 €.',[S('Soll','5202',5000),S('Haben','2200',5000)],5000);
add(6,'Zwei Bestandsveränderungen','inventory','Unfertige Erzeugnisse: Mehrbestand 4.000 €. Fertige Erzeugnisse: Minderbestand 3.000 €.',[S('Soll','2100',4000),S('Haben','5201',4000),S('Soll','5202',3000),S('Haben','2200',3000)],7000);

add(7,'Maschine mit Vorsteuer','invoice','Maschine 10.000 € netto, 19 % Umsatzsteuer.',[S('Soll','0700',10000),S('Soll','2600',1900),S('Haben','4400',11900)],11900,{net:10000,tax:1900});
add(7,'Verkauf auf Ziel','invoice','Verkauf eigener Erzeugnisse 4.000 € netto, 19 % Umsatzsteuer.',[S('Soll','2400',4760),S('Haben','5000',4000),S('Haben','4800',760)],4760,{net:4000,tax:760});

add(7,'Büromaterial und Porto mit Vorsteuer','invoice','Büromaterial 600 € netto und Porto-/Versanddienstleistung 100 € netto; beide Positionen laut Rechnung mit 19 % Umsatzsteuer.',[S('Soll','6800',600),S('Soll','6820',100),S('Soll','2600',133),S('Haben','4400',833)],833,{net:700,tax:133});

for(let m=1;m<=8;m++){let original=tasks.find(t=>t.m===m);let aiLines=original.lines.map(x=>[...x]);aiLines[0][1]=aiLines[0][1]==='2800'?'2880':'2800';add(m,'KI-Prüfung: Buchungsvorschlag kontrollieren',original.type,original.desc,original.lines,original.amount,{ai:true,aiLines,net:original.net,tax:original.tax,company:original.company});}
const key='buchungswerkstatt-v8-progress';const accessKey='buchungswerkstatt-v8-access';let progress=JSON.parse(localStorage.getItem(key)||'{}'),access=JSON.parse(localStorage.getItem(accessKey)||'{"1":true}'),logged=false,current=null,mod=1;
const app=document.getElementById('app'), euro=x=>Number(x).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(t){let p=progress[t.id];return p?.correct?'<span class="pill ok">✓ erledigt</span>':p?.attempts?'<span class="pill bad">⚠ Fehler – erneut bearbeiten</span>':'<span class="pill">○ offen</span>'}function allowed(m){return !!access[m]||logged}function page(p){if(p==='dashboard'){let visible=tasks.filter(t=>access[t.m]),correct=visible.filter(t=>progress[t.id]?.correct).length,errors=visible.filter(t=>progress[t.id]?.attempts&&!progress[t.id].correct).length;app.innerHTML=`<h1>Willkommen in der Buchungswerkstatt</h1><div class="note">Erst selbst verstehen. Dann KI kontrollieren.</div><div class="grid"><div class="card"><h2>${correct}</h2>Richtig erledigt</div><div class="card"><h2>${errors}</h2>Mit Fehlern bearbeitet</div><div class="card"><h2>${visible.length-correct-errors}</h2>Noch offen</div><div class="card"><h2>${names.filter((_,i)=>access[i+1]).length}</h2>Freigeschaltete Module</div></div><div class="card"><h2>Dein Lernfortschritt</h2>${names.map((n,i)=>access[i+1]?`<div class="row"><span>Modul ${i+1}: ${esc(n)} – ${tasks.filter(t=>t.m===i+1&&progress[t.id]?.correct).length} von 6 erledigt</span><button class="btn" onclick="openModule(${i+1})">Öffnen</button></div>`:'').join('')}</div>`}else if(p==='modules'){app.innerHTML=`<h1>Lernmodule</h1><p class="muted">Bearbeite zuerst die Buchungen selbst. Prüfe anschließend den KI-Vorschlag.</p><div class="grid">${names.map((n,i)=>`<div class="card"><div class="small muted">MODUL ${i+1}</div><h2>${esc(n)}</h2><p>${tasks.filter(t=>t.m===i+1&&progress[t.id]?.correct).length} von 6 Aufgaben richtig erledigt</p><button class="btn primary" ${allowed(i+1)?`onclick="openModule(${i+1})"`:'disabled'}>${allowed(i+1)?'Modul öffnen':'🔒 Gesperrt'}</button></div>`).join('')}</div>`}else if(p==='inbox'){app.innerHTML=`<h1>Belegübersicht</h1><div class="card">${tasks.filter(t=>allowed(t.m)).map(t=>`<div class="row"><div>${status(t)} <strong> ${esc(t.number)}</strong> · Modul ${t.m} · ${esc(t.title)}<div class="small muted">${esc(typeName(t.type))} · ${euro(t.amount)}</div></div><button class="btn" onclick="openTask('${t.id}')">Öffnen</button></div>`).join('')}</div>`}else if(p==='ikr'){app.innerHTML=`<h1>IKR-Kontenrahmen</h1><div class="card"><a href="https://c.wgr.de/d/361d22bb68935fbd4f25aa193d86596e761bff33cc0748f93cb23d413d4231b8.pdf/IKR_Kontenrahmen_WEB%202024_Final.pdf" target="_blank" rel="noopener">Vollständigen IKR als PDF öffnen</a><iframe title="IKR-Kontenrahmen" src="https://c.wgr.de/d/361d22bb68935fbd4f25aa193d86596e761bff33cc0748f93cb23d413d4231b8.pdf/IKR_Kontenrahmen_WEB%202024_Final.pdf"></iframe></div>`}else if(p==='teacher'){if(!logged)return teacher();app.innerHTML=`<h1>Lehrkraft · Modulfreigaben</h1><div class="note error"><strong>Wichtig:</strong> Die Freigaben werden nur in diesem Browser gespeichert. Sie gelten nicht automatisch für die Geräte der Schülerinnen und Schüler. Der PIN im HTML-Quelltext ist kein sicherer Zugangsschutz.</div><div class="card">${names.map((n,i)=>`<div class="row"><span>Modul ${i+1}: ${esc(n)}</span><label><input style="width:auto" type="checkbox" ${access[i+1]?'checked':''} onchange="toggle(${i+1},this.checked)"> Freigeschaltet</label></div>`).join('')}</div><button class="btn" onclick="logged=false;page('dashboard')">Abmelden</button>`}}function typeName(t){return {invoice:'Rechnung',cash:'Kassenbeleg',bank:'Kontoauszug / Überweisung',advice:'Bankmitteilung',depreciation:'ERP-Abschreibungslauf',inventory:'Inventur-/Bestandsmeldung',credit:'Korrekturrechnung / Gutschrift',internal:'Interner Buchungsbeleg'}[t]}
function openModule(m){if(!allowed(m))return alert('Dieses Modul ist gesperrt.');mod=m;app.innerHTML=`<button class="btn" onclick="page('modules')">← Alle Module</button><h1>Modul ${m}: ${esc(names[m-1])}</h1><div class="card">${tasks.filter(t=>t.m===m).map((t,i)=>`<div class="row"><div><strong>${t.ai?'✦ KI-Prüfung':`Aufgabe ${i+1}`}: ${esc(t.title)}</strong><div class="small muted">${esc(typeName(t.type))}</div>${status(t)}</div><button class="btn" onclick="openTask('${t.id}')">${progress[t.id]?.correct?'Erneut bearbeiten':progress[t.id]?.attempts?'Fehler überprüfen':'Öffnen'}</button></div>`).join('')}</div>`}
function doc(t){let title=typeName(t.type).toUpperCase();let more=t.type==='depreciation'?'ERP · Anlagenbuchhaltung · Abschreibungsvorschlag – noch nicht gebucht':t.type==='inventory'?'ERP · Inventur / Produktionscontrolling':t.type==='cash'?'Hauptkasse 01 · Interner Kassenbeleg':t.type==='advice'?'Firmenkundenservice · Darlehens-/Bankmitteilung':t.type==='bank'?'Elektronischer Kontoauszug · Geschäftskonto':t.type==='credit'?'Korrektur zu einem bereits gebuchten Geschäftsvorfall':'Geschäftsbeleg';return `<div class="doc"><div class="small muted">${esc(more)}</div><h2>${esc(title)}</h2><p><strong>${esc(t.company)}</strong></p><hr><p><strong>Belegnummer:</strong> ${esc(t.number)}<br><strong>Datum:</strong> ${esc(t.date.split('-').reverse().join('.'))}</p><hr><h3>Geschäftsvorfall / Belegtext</h3><p>${esc(t.desc)}</p><hr>${t.net!==undefined?`<p>Nettobetrag: ${euro(t.net)}<br>Umsatzsteuer (19 %): ${euro(t.tax)}</p>`:''}<h3>${t.type==='credit'?'Korrekturbetrag':t.type==='depreciation'?'Abschreibungsbetrag':t.type==='inventory'?'Wert der Bestandsveränderung':'Betrag'}: ${euro(t.amount)}</h3><p class="small muted">Didaktisch vereinfachter Musterbeleg. ${t.m<7?'Umsatzsteuer wird hier nicht berücksichtigt.':''}</p></div>`}
function options(selected){return `<option value="">Konto wählen</option>`+Object.entries(accounts).map(([id,name])=>`<option value="${id}" ${id===selected?'selected':''}>${id} – ${esc(name)}</option>`).join('')}
function openTask(id){let t=tasks.find(x=>x.id===id);if(!t||!allowed(t.m))return;current=t;mod=t.m;let rows=t.ai?t.aiLines:t.lines.map(()=>['','','']);app.innerHTML=`<button class="btn" onclick="openModule(${t.m})">← Aufgabenübersicht</button><h1>${t.ai?'KI-Buchung überprüfen':esc(t.title)}</h1><div class="work"><div>${doc(t)}</div><div class="card"><h2>${t.ai?'KI-Vorschlag kontrollieren':'Buchung erfassen'}</h2>${t.ai?'<div class="note">Die KI hat den Buchungssatz vorausgefüllt. Finde und korrigiere mögliche Fehler.</div>':''}<label>Belegnummer</label><input id="number" value="${t.ai?esc(t.number):''}"><label>Buchungsdatum</label><input id="date" type="date" value="${t.ai?esc(t.date):''}"><h3>Buchungszeilen</h3><div id="rows">${rows.map((r,i)=>lineHtml(r,i)).join('')}</div><button class="btn" onclick="addLine()">+ Buchungszeile</button>${t.ai?'<h3>Kontrollliste</h3>'+['Belegnummer und Datum','Beträge','IKR-Konten','Soll/Haben','Vollständigkeit der Buchung','Umsatzsteuer / Preisnachlässe (falls relevant)'].map((x,i)=>`<label><input class="check" type="checkbox" style="width:auto"> ${x}</label>`).join(''):''}<p><button class="btn primary" onclick="check()">Buchung prüfen</button> <button class="btn" onclick="openTask('${t.id}')">Zurücksetzen</button></p><div id="feedback"></div></div></div>`}
function lineHtml(r,i){return `<div class="line"><select class="side"><option value="">Soll/Haben</option><option ${r[0]==='Soll'?'selected':''}>Soll</option><option ${r[0]==='Haben'?'selected':''}>Haben</option></select><select class="account">${options(r[1])}</select><input class="amount" type="number" min="0" step="0.01" placeholder="Betrag" value="${r[2]||''}"></div>`}function addLine(){document.getElementById('rows').insertAdjacentHTML('beforeend',lineHtml(['','',''],0))}
function normalize(a){return a.map(r=>`${r[0]}|${r[1]}|${Math.round(Number(r[2])*100)}`).sort().join(';')}
function check(){let t=current,number=document.getElementById('number').value.trim(),date=document.getElementById('date').value,rows=[...document.querySelectorAll('#rows .line')].map(el=>[el.querySelector('.side').value,el.querySelector('.account').value,Number(el.querySelector('.amount').value)]).filter(r=>r[0]||r[1]||r[2]);let checks=t.ai?[...document.querySelectorAll('.check')].every(x=>x.checked):true;let correct=number===t.number&&date===t.date&&normalize(rows)===normalize(t.lines)&&checks;let old=progress[t.id]||{attempts:0};progress[t.id]={attempts:old.attempts+1,correct:!!(old.correct||correct)};localStorage.setItem(key,JSON.stringify(progress));document.getElementById('feedback').innerHTML=correct?`<div class="note"><strong>✓ Richtig bearbeitet!</strong><p>${t.lines.map(r=>`${r[0]}: ${r[1]} ${esc(accounts[r[1]])} – ${euro(r[2])}`).join('<br>')}</p></div>`:`<div class="note error"><strong>⚠ Noch nicht vollständig richtig.</strong><p>Prüfe ${[number!==t.number?'Belegnummer':null,date!==t.date?'Datum':null,normalize(rows)!==normalize(t.lines)?'Konten, Soll/Haben und Beträge':null,!checks?'alle Kontrollkästchen':null].filter(Boolean).join(', ')}. Die Aufgabe bleibt als fehlerhaft markiert, bis du sie richtig löst.</p></div>`}
function teacher(){if(logged)return page('teacher');let pin=prompt('Lehrkraft-PIN eingeben:');if(pin==='1397'){logged=true;page('teacher')}else if(pin!==null)alert('PIN nicht korrekt.')}function toggle(m,on){access[m]=on;localStorage.setItem(accessKey,JSON.stringify(access))}function firstAI(){let t=tasks.find(x=>x.ai&&allowed(x.m));if(t)openTask(t.id);else alert('Keine KI-Aufgabe freigeschaltet.')}page('dashboard');
</script></body></html>
